<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101610;font-family:system-ui;color:#fff}button{font:inherit}.hud{position:fixed;z-index:5;top:8px;left:8px;right:8px;display:flex;gap:7px;align-items:center;pointer-events:none}.brand,.pill,.tools{background:#172219eF;border:1px solid #5d7056;border-radius:12px;box-shadow:0 4px 15px #0008}.brand{padding:8px 12px;color:#f3c85d;font-weight:900}.pill{padding:7px 9px;font-size:12px}.pill b{color:#f3c85d}.tools{margin-right:auto;display:flex;gap:5px;padding:4px;pointer-events:auto}.tools button{border:0;background:#29382b;color:#fff;border-radius:8px;padding:6px 9px}
#view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#view.drag{cursor:grabbing}#world{position:absolute;width:2200px;height:1500px;transform-origin:0 0}
svg{width:100%;height:100%;display:block}
.bottom{position:fixed;z-index:5;bottom:8px;left:8px;right:8px;display:flex;gap:7px;justify-content:center}.bottom button{background:#182319ed;border:1px solid #637557;color:#fff;border-radius:11px;padding:9px 12px;box-shadow:0 4px 15px #0007}.bottom .gold{background:#5a491e;border-color:#d1ab54;color:#ffe39a}
.modal{position:fixed;z-index:20;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(520px,95vw);max-height:85vh;overflow:auto;background:#172219;border:1px solid #6a7b60;border-radius:17px;padding:15px}.box h2{color:#f3c85d;margin:0 0 8px}.row{padding:10px 0;border-bottom:1px solid #334133;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.row button{background:#2b3b2d;border:1px solid #687b60;color:#fff;border-radius:9px;padding:7px}.close{margin-top:12px;background:#5a491e!important;border-color:#d1ab54!important;color:#ffe39a!important}
.toast{position:fixed;z-index:30;top:72px;left:50%;transform:translateX(-50%);background:#1d2c1e;border:1px solid #718665;border-radius:11px;padding:8px 13px;opacity:0;transition:.2s}.toast.on{opacity:1}

<g id="farmer" transform="translate(1030 730)"><circle cx="30" cy="20" r="20" fill="#bd825d" stroke="#593d30" stroke-width="4"/><path d="M8 14Q30 -10 52 14" fill="#c5a04d" stroke="#725b2b" stroke-width="5"/><rect x="7" y="42" width="46" height="58" rx="13" fill="#3e6c47" stroke="#29452f" stroke-width="4"/><path d="M16 98V128M44 98V128" stroke="#3b3129" stroke-width="13" stroke-linecap="round"/></g>

<g transform="translate(1450 760)"><polygon points="0,90 210,0 420,90 390,270 30,270" fill="#343c3e" stroke="#242b2d" stroke-width="10"/><rect x="35" y="92" width="350" height="180" fill="#646c69" stroke="#3b4240" stroke-width="8"/><rect x="150" y="155" width="120" height="117" fill="#252b2b"/><text x="210" y="315" text-anchor="middle" fill="white" font-size="27" font-weight="bold">INDUSTRIAL WAREHOUSE</text></g>

<!-- truck -->
<g transform="translate(1080 1090)"><rect x="0" y="15" width="115" height="65" rx="6" fill="#9c713f" stroke="#513a27" stroke-width="7"/><rect x="105" y="25" width="55" height="55" rx="8" fill="#4f7274" stroke="#2b4142" stroke-width="7"/><circle cx="35" cy="88" r="22" fill="#202522" stroke="#626a64" stroke-width="8"/><circle cx="125" cy="88" r="22" fill="#202522" stroke="#626a64" stroke-width="8"/></g>

<div class="bottom"><button class="gold" id="plant">🌱 زراعة 10</button><button id="waterBtn">💧 سقي</button><button id="harvest">🌾 حصاد 10</button><button id="manage">⚙ إدارة</button></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h2>Kingdom Harvest — الإدارة</h2><div id="body"></div><button class="close" id="close">إغلاق</button></div></div>
<script>
const S={coins:12,water:20,maxWater:20,field:0,cap:50,store:0,storeCap:100,seeds:0,wheat:0,flour:0,straw:0,well:1,road:false,truck:1};
const $=id=>document.getElementById(id);function ui(){$('coins').textContent=S.coins.toFixed(2).replace('.00','');$('water').textContent=S.water+'/'+S.maxWater;$('field').textContent=S.field+'/'+S.cap;$('svgField').textContent=S.field+'/'+S.cap;$('store').textContent=S.store+'/'+S.storeCap}
function msg(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('on'),1700)}
$('plant').onclick=()=>{if(S.seeds<10){if(S.coins<10)return msg('تحتاج 10 عملات لشراء 50 بذرة');S.coins-=10;S.seeds+=50}if(S.field+10>S.cap)return msg('الحقل ممتلئ');S.seeds-=10;S.field+=10;S.store=Math.min(S.storeCap,S.store+10);msg('تم زرع 10 وحدات');ui()};
$('waterBtn').onclick=()=>{if(S.water<10)return msg('الماء غير كافٍ');S.water-=10;msg('العامل يسقي المحصول');ui()};
$('harvest').onclick=()=>{if(S.field<10)return msg('لا توجد 10 وحدات جاهزة');S.field-=10;S.wheat+=10;S.flour++;S.straw++;S.coins+=2.5;msg('+10 قمح + طحين + تبن');ui()};
const v=$('view'),w=$('world');let x=0,y=0,z=1,drag=false,sx,sy,ox,oy;
function render(){const W=v.clientWidth,H=v.clientHeight;x=Math.min(0,Math.max(W-2200*z,x));y=Math.min(0,Math.max(H-1500*z,y));w.style.transform=`translate(${x}px,${y}px) scale(${z})`}
v.onpointerdown=e=>{drag=true;v.classList.add('drag');sx=e.clientX;sy=e.clientY;ox=x;oy=y;v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){x=ox+e.clientX-sx;y=oy+e.clientY-sy;render()}};v.onpointerup=()=>{drag=false;v.classList.remove('drag')};v.onpointercancel=()=>{drag=false;v.classList.remove('drag')};
$('zin').onclick=()=>{z=Math.min(1.25,z+.1);render()};$('zout').onclick=()=>{z=Math.max(.65,z-.1);render()};$('home').onclick=()=>{z=.8;x=(v.clientWidth-2200*z)/2;y=(v.clientHeight-1500*z)/2;render()};
$('manage').onclick=()=>{$('body').innerHTML=`<div class="row"><span>الحقل</span><b>${S.cap}</b><button id="uf">${S.cap===50?'تطوير 10,000 🪙':'مطور'}</button></div><div class="row"><span>البئر</span><b>Lv.${S.well} • ${S.maxWater} دلو/30د</b><button id="uw">تطوير</button></div><div class="row"><span>الشاحنة</span><b>Lv.${S.truck} • سعة ${15+S.truck*5}</b><button id="ut">تطوير</button></div><div class="row"><span>الطريق</span><b>${S.road?'مبني • 10 دقائق':'ترابي • 13 دقيقة'}</b><button id="ur">${S.road?'مبني':'بناء 500 🪙'}</button></div><p>الحظائر، التكاثر، المصانع، الوصفات، السوق، والرحلات ستعمل فوق هذا العالم في النسخة البرمجية التالية.</p>`;$('modal').classList.add('show');
$('uf').onclick=()=>{if(S.cap===100)return;if(S.coins>=10000){S.coins-=10000;S.cap=100;msg('الحقل أصبح 100')}else msg('تحتاج 10,000');ui();$('manage').click()};
$('uw').onclick=()=>{if(S.well>=10)return msg('البئر في المستوى الأقصى');let c=[0,100,250,500,900,1500,2500,4000,6000,9000][S.well];if(S.coins>=c){S.coins-=c;S.well++;S.maxWater=20+Math.round(15*(S.well-1)/9);S.water=S.maxWater;msg('تم تطوير البئر')}else msg('تحتاج '+c);ui();$('manage').click()};
$('ut').onclick=()=>{if(S.truck>=7)return;let c=100*S.truck;if(S.coins>=c){S.coins-=c;S.truck++;msg('تم تطوير الشاحنة')}else msg('تحتاج '+c);ui();$('manage').click()};
$('ur').onclick=()=>{if(S.road)return;if(S.coins>=500){S.coins-=500;S.road=true;msg('تم بناء الطريق')}else msg('تحتاج 500');ui();$('manage').click()}};
$('close').onclick=()=>{$('modal').classList.remove('show')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
window.onresize=render;S.field=0;ui();setTimeout(()=>{$('home').click()},50);
</script></body></html>
