<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kingdom Harvest</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1710;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
button{font:inherit}
#view{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#50764d;cursor:grab}
#view.drag{cursor:grabbing}
#world{position:absolute;width:2200px;height:1500px;transform-origin:0 0}
.ground{position:absolute;inset:0;background:
radial-gradient(ellipse at 45% 20%,#93b879 0,#729c68 35%,#4e774e 70%,#385b3e 100%)}
.grass{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#e7efcf 1px,transparent 1px);background-size:27px 27px}
.river{position:absolute;left:-120px;top:575px;width:2440px;height:230px;background:linear-gradient(150deg,#4d9fbc,#77c8d2,#3d88aa);transform:rotate(-4deg);border-top:12px solid #b5cf94;border-bottom:12px solid #b5cf94;box-shadow:inset 0 15px 25px #22546c55,inset 0 -15px 25px #22546c55}
.road{position:absolute;background:#bca57c;border:7px solid #80694b;box-shadow:inset 0 0 0 3px #d8c497}
.road.main{left:-30px;top:755px;width:2260px;height:130px;transform:rotate(-2deg)}
.road.ind{left:1190px;top:650px;width:850px;height:78px;transform:rotate(7deg)}

.cardbuild{position:absolute;filter:drop-shadow(0 12px 9px #20301d88)}
.roof{position:absolute;inset:0 0 58px 0;background:linear-gradient(145deg,#a86142,#552c27);clip-path:polygon(50% 0,100% 35%,88% 100%,12% 100%,0 35%);border:5px solid #5c372b}
.walls{position:absolute;left:7%;right:7%;bottom:0;height:66%;background:linear-gradient(135deg,#d6aa70,#986a45);border:5px solid #6e4c34;border-radius:8px}
.door{position:absolute;bottom:0;left:41%;width:18%;height:45%;background:#513625;border:5px solid #3a281e;border-bottom:0}
.window{position:absolute;bottom:29%;width:16%;height:20%;background:#91ceda;border:5px solid #60472f}
.house{left:70px;top:115px;width:330px;height:255px}
.house .w1{left:16%}.house .w2{right:16%}
.storage{left:465px;top:125px;width:265px;height:215px}
.market{left:775px;top:115px;width:300px;height:225px}
.market .walls{background:linear-gradient(135deg,#d2bb72,#8a6e3d)}
.market .roof{background:linear-gradient(145deg,#884d3e,#4b2928)}
.awning{position:absolute;left:12%;right:12%;bottom:24%;height:17%;background:repeating-linear-gradient(90deg,#ead59a 0 30px,#914e40 31px 60px);border:3px solid #684233}

.barn{width:300px;height:225px}
.barn .roof{background:linear-gradient(145deg,#864333,#482725)}
.barn .walls{background:linear-gradient(135deg,#c77d48,#8a5132)}
.barn .doubleDoor{position:absolute;bottom:0;left:31%;width:38%;height:48%;background:#563724;border:5px solid #3c281d}
.sheepBarn{left:55px;top:425px}.cowBarn{left:390px;top:425px}
.coop{left:730px;top:445px;width:245px;height:185px}
.coop .roof{background:linear-gradient(145deg,#a65c45,#62322c)}
.coop .walls{background:#d1a267}

.animal{position:absolute;z-index:4;filter:drop-shadow(0 5px 3px #17231677)}
.sheep1{left:120px;top:510px;font-size:58px;animation:animal1 5s ease-in-out infinite}
.sheep2{left:250px;top:535px;font-size:54px;animation:animal2 6s ease-in-out infinite}
.cow1{left:445px;top:510px;font-size:62px;animation:animal2 7s ease-in-out infinite}
.cow2{left:590px;top:540px;font-size:58px;animation:animal1 6s ease-in-out infinite}
.chicken{left:805px;top:545px;font-size:52px;animation:animal1 4s ease-in-out infinite}
@keyframes animal1{50%{transform:translateX(35px)}}@keyframes animal2{50%{transform:translateX(-28px)}}

.well{position:absolute;left:1040px;top:370px;width:155px;height:155px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#579bb1 0 30%,#3e7583 31% 43%,#858b86 44% 69%,#565e5a 70%);border:11px solid #747a76;box-shadow:0 14px 18px #20301e77}
.well:before{content:"";position:absolute;left:64px;top:-72px;width:16px;height:95px;background:#505651;transform:rotate(-5deg);border-radius:7px}
.well:after{content:"";position:absolute;left:25px;top:-58px;width:92px;height:12px;background:#474d48;transform:rotate(12deg);border-radius:7px}

.field{position:absolute;left:270px;top:820px;width:930px;height:450px;border:15px solid #65422a;border-radius:34px;background:repeating-linear-gradient(0deg,#845735 0 29px,#a56d3e 30px 36px);box-shadow:inset 0 0 0 4px #c0844e,0 16px 22px #24341f77}
.fieldRows{position:absolute;inset:30px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.crop{background:linear-gradient(#679b48,#3f7035);border-radius:14px;box-shadow:inset 0 -10px 12px #29491d55;position:relative}
.crop:after{content:"";position:absolute;left:30%;right:30%;top:12%;bottom:12%;background:repeating-linear-gradient(90deg,#a0c866 0 4px,transparent 5px 10px);border-radius:50%}
.fieldTitle{position:absolute;top:-52px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#20301fdd;border:1px solid #728965;border-radius:11px;padding:8px 15px;font-weight:900}

.farmer{position:absolute;left:1040px;top:720px;width:60px;height:110px;z-index:10;animation:walk 6s ease-in-out infinite}
.farmer .head{position:absolute;left:16px;top:0;width:30px;height:30px;border-radius:50%;background:#c58a61;border:3px solid #684638}
.farmer .hat{position:absolute;left:5px;top:-5px;width:52px;height:15px;border-radius:50%;background:#d1aa55;border:3px solid #725929}
.farmer .body{position:absolute;left:8px;top:30px;width:44px;height:53px;border-radius:12px;background:#416c48;border:3px solid #29452f}
.farmer .leg{position:absolute;top:79px;width:13px;height:30px;border-radius:8px;background:#40362e}.farmer .l1{left:12px}.farmer .l2{right:12px}
.task{position:absolute;left:1005px;top:680px;background:#20301fdd;border:1px solid #718965;border-radius:10px;padding:5px 9px;font-size:13px;z-index:11}
@keyframes walk{50%{transform:translateX(70px)}}

.gate{position:absolute;left:990px;top:1260px;width:280px;height:120px;background:#334932;border:16px solid #60452d;border-radius:12px;z-index:6}
.gate:before,.gate:after{content:"";position:absolute;bottom:-16px;width:22px;height:120px;background:#63462e}.gate:before{left:-37px}.gate:after{right:-37px}
.gateLabel{position:absolute;top:-57px;left:0;right:0;text-align:center;background:#24351fef;border:1px solid #819871;border-radius:10px;padding:8px;font-weight:900;color:#ffe29a}

.industry{position:absolute;left:1280px;top:80px;width:850px;height:1300px;border-radius:35px;background:linear-gradient(145deg,#688368,#405e49);border:14px solid #344a38;box-shadow:inset 0 0 0 4px #7b9671}
.indTitle{position:absolute;top:28px;left:0;right:0;text-align:center;color:#f4ce69;font-size:30px;font-weight:900}
.factory{position:absolute;width:260px;height:215px}
.factory .roof{background:linear-gradient(145deg,#5f6970,#30393d)}
.factory .walls{background:linear-gradient(135deg,#aaa48e,#686a5e)}
.factory .chimney{position:absolute;right:14%;top:8px;width:32px;height:83px;background:#55595a;border:4px solid #303638}
.bakery{left:50px;top:115px}.sweets{left:355px;top:115px}.clothes{left:50px;top:380px}.shoes{left:355px;top:380px}
.factoryName{position:absolute;bottom:-38px;left:0;right:0;text-align:center;font-size:22px;font-weight:900}

.indWarehouse{position:absolute;left:150px;top:680px;width:430px;height:260px}
.indWarehouse .roof{background:linear-gradient(145deg,#4e595e,#293438)}
.indWarehouse .walls{background:linear-gradient(135deg,#747d79,#4c5653)}
.indName{position:absolute;bottom:-42px;left:0;right:0;text-align:center;font-weight:900;font-size:22px}

.playerMarket{position:absolute;left:90px;top:1010px;width:600px;height:250px;border:8px solid #d0ad68;border-radius:18px;background:linear-gradient(145deg,#987541,#674b2e)}
.playerMarket h3{text-align:center;margin:15px;color:#ffe49a;font-size:26px}
.stalls{display:flex;justify-content:space-around;gap:12px;padding:20px}
.stall{height:115px;flex:1;background:#7e5b37;border:3px solid #d0ad68;border-radius:8px;position:relative}
.stall:before{content:"";position:absolute;left:-5px;right:-5px;top:-24px;height:28px;background:#9b4f3f;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}

.truck{position:absolute;left:1080px;top:1100px;width:170px;height:80px;z-index:12;animation:truckMove 14s linear infinite}
.truckBox{position:absolute;left:0;top:10px;width:115px;height:65px;background:#9b6f3f;border:4px solid #503925;border-radius:6px}
.truckCab{position:absolute;right:0;top:22px;width:65px;height:53px;background:#4e7476;border:4px solid #2b4142;border-radius:8px}
.wheel{position:absolute;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#202522;border:6px solid #626961}.wheel1{left:20px}.wheel2{right:22px}
@keyframes truckMove{50%{transform:translateX(650px)}}

.label{position:absolute;background:#20301fdd;border:1px solid #728965;border-radius:10px;padding:7px 12px;font-weight:900;z-index:15}
.farmLabel{left:55px;top:45px}.indLabel{left:1520px;top:40px}

.hud{position:fixed;z-index:30;top:7px;left:7px;right:7px;display:flex;align-items:center;gap:6px;pointer-events:none}
.brand,.pill{background:#172219ed;border:1px solid #5d7056;border-radius:12px;box-shadow:0 4px 14px #0008}
.brand{padding:8px 11px;color:#f3ca65;font-weight:900}.pill{padding:7px 9px;font-size:12px}.pill b{color:#f3ca65}
.zoom{margin-right:auto;display:flex;gap:5px;pointer-events:auto}.zoom button{background:#263528;border:1px solid #62735a;color:#fff;border-radius:9px;padding:7px 10px}
.bottom{position:fixed;z-index:30;bottom:7px;left:7px;right:7px;display:flex;justify-content:center;gap:7px;pointer-events:none}.bottom button{pointer-events:auto;background:#182319ed;border:1px solid #637557;color:#fff;border-radius:11px;padding:9px 12px}.bottom .gold{background:#5a491e;border-color:#d1ab54;color:#ffe39a}
.modal{position:fixed;z-index:50;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(520px,95vw);max-height:85vh;overflow:auto;background:#172219;border:1px solid #6a7b60;border-radius:17px;padding:15px}.box h2{color:#f3c85d;margin:0 0 8px}.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.res div{background:#202d21;border:1px solid #40503f;border-radius:10px;padding:9px}.res b{color:#f4ce69}.close{margin-top:12px;background:#5a491e;border:1px solid #d1ab54;color:#ffe39a;border-radius:10px;padding:9px 14px}
.toast{position:fixed;z-index:60;top:70px;left:50%;transform:translateX(-50%);background:#1e2d20;border:1px solid #718665;border-radius:11px;padding:8px 13px;opacity:0;transition:.2s}.toast.on{opacity:1}
</style>
</head>
<body>
<div class="hud">
  <div class="brand">KINGDOM HARVEST 🌾</div>
  <div class="pill">🪙 <b id="coins">12</b></div>
  <div class="pill">💧 <b id="water">20/20</b></div>
  <div class="pill">🌾 <b id="fieldStat">0/50</b></div>
  <div class="pill">📦 <b id="storeStat">0/100</b></div>
  <div class="zoom"><button id="zin">＋</button><button id="zout">−</button><button id="center">⌂</button></div>
</div>

<div id="view">
  <div id="world">
    <div class="ground"></div><div class="grass"></div><div class="river"></div>
    <div class="road main"></div><div class="road ind"></div>
    <div class="label farmLabel">🌿 FARM DISTRICT</div>

    <div class="cardbuild house"><div class="roof"></div><div class="walls"></div><div class="door"></div><div class="window w1"></div><div class="window w2"></div></div>
    <div class="cardbuild storage"><div class="roof"></div><div class="walls"></div><div class="door"></div></div>
    <div class="cardbuild market"><div class="roof"></div><div class="walls"></div><div class="awning"></div></div>

    <div class="cardbuild barn sheepBarn"><div class="roof"></div><div class="walls"></div><div class="doubleDoor"></div></div>
    <div class="cardbuild barn cowBarn"><div class="roof"></div><div class="walls"></div><div class="doubleDoor"></div></div>
    <div class="cardbuild coop"><div class="roof"></div><div class="walls"></div></div>

    <div class="animal sheep1">🐑</div><div class="animal sheep2">🐑</div>
    <div class="animal cow1">🐄</div><div class="animal cow2">🐄</div><div class="animal chicken">🐔</div>

    <div class="well"></div>

    <div class="field">
      <div class="fieldTitle">CONTINUOUS FIELD • <span id="fieldTitle">0/50</span></div>
      <div class="fieldRows"><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div><div class="crop"></div></div>
    </div>

    <div class="farmer"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div></div>
    <div class="task">👨‍🌾 العامل يعمل في المزرعة</div>

    <div class="gate"><div class="gateLabel">🚪 بوابة المنطقة الصناعية</div></div>

    <div class="industry">
      <div class="indTitle">🏭 INDUSTRIAL DISTRICT</div>
      <div class="factory bakery"><div class="roof"></div><div class="walls"></div><div class="chimney"></div><div class="factoryName">BAKERY</div></div>
      <div class="factory sweets"><div class="roof"></div><div class="walls"></div><div class="chimney"></div><div class="factoryName">SWEETS</div></div>
      <div class="factory clothes"><div class="roof"></div><div class="walls"></div><div class="chimney"></div><div class="factoryName">CLOTHING</div></div>
      <div class="factory shoes"><div class="roof"></div><div class="walls"></div><div class="chimney"></div><div class="factoryName">SHOES</div></div>
      <div class="indWarehouse"><div class="roof"></div><div class="walls"></div><div class="door"></div><div class="indName">INDUSTRIAL WAREHOUSE</div></div>
      <div class="playerMarket"><h3>PLAYER MARKET</h3><div class="stalls"><div class="stall"></div><div class="stall"></div><div class="stall"></div><div class="stall"></div></div></div>
    </div>

    <div class="truck"><div class="truckBox"></div><div class="truckCab"></div><div class="wheel wheel1"></div><div class="wheel wheel2"></div></div>
  </div>
</div>

<div class="bottom">
  <button class="gold" id="plant">🌱 زراعة 10</button>
  <button id="waterBtn">💧 سقي</button>
  <button id="harvest">🌾 حصاد 10</button>
  <button id="inventory">📦 المخزن</button>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h2>📦 مخزن Kingdom Harvest</h2><div class="res" id="resources"></div><button class="close" id="close">إغلاق</button></div></div>

<script>
const S={coins:12,water:20,maxWater:20,field:0,cap:50,store:0,storeCap:100,seeds:0,wheat:0,flour:0,straw:0,wool:0,leather:0,eggs:0,milk:0,bread:0,pancake:0,tarte:0,shirt:0,capItem:0,sandal:0,sneaker:0};
const $=id=>document.getElementById(id);
function ui(){ $('coins').textContent=S.coins.toFixed(2).replace('.00',''); $('water').textContent=S.water+'/'+S.maxWater; $('fieldStat').textContent=S.field+'/'+S.cap; $('fieldTitle').textContent=S.field+'/'+S.cap; $('storeStat').textContent=S.store+'/'+S.storeCap; }
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('on'),1700)}
$('plant').onclick=()=>{if(S.seeds<10){if(S.coins<10)return toast('تحتاج 10 🪙 لشراء 50 بذرة');S.coins-=10;S.seeds+=50;toast('تم شراء 50 بذرة')}if(S.field+10>S.cap)return toast('الحقل ممتلئ');S.seeds-=10;S.field+=10;S.store=Math.min(S.storeCap,S.store+10);toast('تم زرع 10 وحدات');ui()};
$('waterBtn').onclick=()=>{if(S.water<10)return toast('الماء غير كافٍ');S.water-=10;toast('العامل يسقي المحصول');ui()};
$('harvest').onclick=()=>{if(S.field<10)return toast('لا توجد 10 وحدات جاهزة للحصاد');S.field-=10;S.wheat+=10;S.flour+=1;S.straw+=1;S.coins+=2.5;S.store=Math.min(S.storeCap,S.store+12);toast('الحصاد: +10 قمح +1 طحين +1 تبن');ui()};
const view=$('view'),world=$('world');let x=0,y=0,z=.78,drag=false,sx=0,sy=0,ox=0,oy=0;
function render(){const W=view.clientWidth,H=view.clientHeight;const ww=2200*z,hh=1500*z;x=Math.min(0,Math.max(W-ww,x));y=Math.min(0,Math.max(H-hh,y));world.style.transform=`translate(${x}px,${y}px) scale(${z})`}
view.addEventListener('pointerdown',e=>{drag=true;view.classList.add('drag');sx=e.clientX;sy=e.clientY;ox=x;oy=y;view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;render()});
view.addEventListener('pointerup',()=>{drag=false;view.classList.remove('drag')});view.addEventListener('pointercancel',()=>{drag=false;view.classList.remove('drag')});
$('zin').onclick=()=>{z=Math.min(1.2,z+.1);render()};$('zout').onclick=()=>{z=Math.max(.55,z-.1);render()};$('center').onclick=()=>{z=.78;x=(view.clientWidth-2200*z)/2;y=(view.clientHeight-1500*z)/2;render()};
$('inventory').onclick=()=>{const names={wheat:'🌾 قمح',flour:'🥣 أكياس طحين',straw:'🌾 تبن',wool:'🧶 صوف',leather:'🧴 جلد',eggs:'🥚 بيض',milk:'🥛 حليب',bread:'🥖 خبز',pancake:'🥞 بانكيك',tarte:'🎂 طارطة',shirt:'👕 تيشرت',capItem:'🧢 قبعة',sandal:'🩴 نعل',sneaker:'👟 باسكيت',seeds:'🌱 بذور'};$('resources').innerHTML=Object.entries(names).map(([k,n])=>`<div><b>${n}</b><br>${S[k]||0}</div>`).join('');$('modal').classList.add('show')};
$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
ui();window.addEventListener('resize',render);setTimeout(()=>{$('center').click()},30);
</script>
</body>
</html>
