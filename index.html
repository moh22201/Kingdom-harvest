<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kingdom Harvest — Farm World V1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172318;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
button{font:inherit}
#game{position:fixed;inset:0;overflow:hidden;background:#658b59;touch-action:none;user-select:none}
#world{
  position:absolute;left:0;top:0;width:2150px;height:1450px;
  transform-origin:0 0;
  background:
    radial-gradient(circle at 30% 15%,rgba(220,238,181,.22) 0 2px,transparent 3px) 0 0/55px 55px,
    linear-gradient(#80a76d,#638c59);
}
#world:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 45%,rgba(0,0,0,.07) 46% 48%,transparent 49%);pointer-events:none}
.waterway{position:absolute;left:-150px;top:620px;width:2450px;height:230px;background:linear-gradient(180deg,#6cc0d0,#3d91ad 50%,#6bbfd0);border-top:14px solid #c7d89e;border-bottom:14px solid #c7d89e;transform:rotate(-3deg);box-shadow:inset 0 20px 35px #20556b55,inset 0 -20px 35px #20556b55}
.path{position:absolute;background:#bda57a;border:7px solid #806c4d;box-shadow:inset 0 0 0 3px #d9c99d}
.path.h{left:-80px;top:790px;width:2300px;height:115px;transform:rotate(-2deg)}
.path.v{left:1040px;top:430px;width:120px;height:850px}
.fence{position:absolute;border:8px solid #77502f;border-radius:18px;box-shadow:inset 0 0 0 3px #b48650}
.zoneTitle{position:absolute;background:#1d2d20e8;border:1px solid #758b69;border-radius:12px;padding:10px 16px;color:#f3ce6d;font-weight:900;z-index:20}

/* buildings */
.building{position:absolute;filter:drop-shadow(0 12px 10px #24351e88)}
.building .roof{position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(145deg,#a76245,#522d28);clip-path:polygon(50% 0,100% 43%,88% 100%,12% 100%,0 43%);border:6px solid #5a362c}
.building .body{position:absolute;left:6%;right:6%;bottom:0;height:65%;border:6px solid #6b4b34;border-radius:9px;background:linear-gradient(135deg,#d6ac72,#976943)}
.building .door{position:absolute;bottom:0;left:40%;width:20%;height:43%;background:#513624;border:5px solid #39261d;border-bottom:0}
.building .window{position:absolute;bottom:28%;width:17%;height:20%;background:#92ced8;border:5px solid #60472f}
.house{left:90px;top:130px;width:350px;height:270px}.house .w1{left:14%}.house .w2{right:14%}
.storage{left:505px;top:145px;width:285px;height:225px}
.market{left:830px;top:130px;width:315px;height:240px}.market .body{background:linear-gradient(135deg,#d4bd75,#876b3b)}
.awning{position:absolute;left:12%;right:12%;bottom:22%;height:18%;background:repeating-linear-gradient(90deg,#ead59a 0 30px,#934e42 31px 60px);border:3px solid #684233;z-index:3}

.barn{width:320px;height:240px}.barn .roof{background:linear-gradient(145deg,#8c4935,#492727)}.barn .body{background:linear-gradient(135deg,#c87f49,#89502f)}
.barn .doubleDoor{position:absolute;bottom:0;left:30%;width:40%;height:48%;background:#553725;border:6px solid #3b291e}
.sheepBarn{left:75px;top:440px}.cowBarn{left:430px;top:440px}
.coop{left:790px;top:455px;width:260px;height:200px}.coop .roof{background:linear-gradient(145deg,#a95c46,#61332c)}.coop .body{background:#d2a365}

.well{position:absolute;left:1110px;top:430px;width:165px;height:165px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#62abc0 0 29%,#397a8d 30% 43%,#858d87 44% 69%,#555d58 70%);border:12px solid #747a76;box-shadow:0 14px 18px #20301e77}
.well:before{content:"";position:absolute;left:72px;top:-82px;width:16px;height:105px;background:#4e554f;transform:rotate(-5deg);border-radius:7px}.well:after{content:"";position:absolute;left:26px;top:-65px;width:105px;height:13px;background:#444a45;transform:rotate(10deg);border-radius:7px}

.field{position:absolute;left:270px;top:940px;width:1050px;height:500px;border:16px solid #65432a;border-radius:38px;background:repeating-linear-gradient(0deg,#805431 0 30px,#a66d3e 31px 37px);box-shadow:inset 0 0 0 4px #c18750,0 18px 25px #24341f77}
.field .inner{position:absolute;inset:32px;border:3px dashed #d49a61;border-radius:25px}
.field .label{position:absolute;top:-60px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#20301fe8;border:1px solid #778d6c;border-radius:11px;padding:8px 15px;font-weight:900}
.field .furrow{position:absolute;left:6%;right:6%;height:22px;border-radius:50%;background:#5d3c28;opacity:.55}
.field .f1{top:24%}.field .f2{top:48%}.field .f3{top:72%}
.cropPatch{position:absolute;left:8%;top:12%;width:18%;height:17%;border-radius:18px;background:linear-gradient(#6d9d49,#3f7338);box-shadow:inset 0 -12px 15px #29471e66}
.cropPatch:after{content:"";position:absolute;inset:10px;background:repeating-linear-gradient(90deg,#a7c96b 0 4px,transparent 5px 11px);border-radius:12px}
.patch2{left:34%}.patch3{left:60%}.patch4{left:76%;top:52%}.patch5{left:12%;top:58%}

.gate{position:absolute;left:1040px;top:1390px;width:300px;height:120px;border:16px solid #62462d;border-radius:14px;background:#334a34;z-index:8}
.gate:before,.gate:after{content:"";position:absolute;bottom:-16px;width:24px;height:120px;background:#67482f}.gate:before{left:-38px}.gate:after{right:-38px}
.gate span{position:absolute;left:50%;top:-58px;transform:translateX(-50%);white-space:nowrap;background:#21321fef;border:1px solid #819574;border-radius:10px;padding:8px 13px;color:#ffe19a;font-weight:900}

.farmer{position:absolute;left:1050px;top:755px;width:66px;height:115px;z-index:25;transition:transform 1.5s linear}
.farmer .head{position:absolute;left:18px;top:0;width:31px;height:31px;border-radius:50%;background:#c98c63;border:3px solid #684638}
.farmer .hat{position:absolute;left:5px;top:-6px;width:55px;height:16px;border-radius:50%;background:#d2aa55;border:3px solid #725929}
.farmer .body{position:absolute;left:9px;top:31px;width:47px;height:55px;border-radius:12px;background:#3f6c47;border:3px solid #29452f}
.farmer .leg{position:absolute;top:83px;width:14px;height:32px;border-radius:8px;background:#40362e}.farmer .l1{left:12px}.farmer .l2{right:12px}
.farmerTag{position:absolute;left:1015px;top:700px;background:#20301fe8;border:1px solid #778d6c;border-radius:10px;padding:6px 10px;font-size:13px;z-index:26}

.animal{position:absolute;z-index:24;font-size:58px;transition:transform 3s ease-in-out}
.s1{left:130px;top:520px}.s2{left:265px;top:540px}.c1{left:485px;top:520px}.c2{left:615px;top:545px}.ch{left:855px;top:550px;font-size:50px}

.farmText{position:absolute;z-index:22;color:#f7f1dd;text-shadow:0 2px 3px #23321f;font-weight:900}.tHouse{left:155px;top:385px}.tStorage{left:575px;top:390px}.tMarket{left:930px;top:385px}.tSheep{left:115px;top:690px}.tCow{left:490px;top:690px}.tChicken{left:830px;top:670px}.tWell{left:1130px;top:615px}

/* fixed HUD */
.hud{position:fixed;z-index:100;top:7px;left:7px;right:7px;display:flex;align-items:center;gap:6px;pointer-events:none}
.brand,.stat,.cam{background:#172319ed;border:1px solid #64775b;border-radius:12px;box-shadow:0 4px 15px #0008}
.brand{padding:8px 11px;color:#f3cb66;font-weight:900}.stat{padding:7px 9px;font-size:12px}.stat b{color:#f3cb66}.cam{margin-right:auto;display:flex;gap:5px;padding:4px;pointer-events:auto}.cam button{width:42px;height:40px;border:0;border-radius:9px;background:#29382b;color:#fff;font-size:20px}
.bottom{position:fixed;z-index:100;bottom:8px;left:8px;right:8px;display:flex;justify-content:center;gap:8px;pointer-events:none}.bottom button{pointer-events:auto;min-height:46px;padding:8px 14px;background:#182319ed;border:1px solid #697b61;color:#fff;border-radius:12px}.bottom .gold{background:#5a491e;border-color:#d4af58;color:#ffe49a}
.modal{position:fixed;z-index:200;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(500px,94vw);background:#172319;border:1px solid #718466;border-radius:17px;padding:16px}.box h2{margin:0 0 12px;color:#f3cb66}.resources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.resources div{padding:10px;background:#202d21;border:1px solid #40513f;border-radius:10px}.resources b{color:#f3cb66}.close{margin-top:12px;border:1px solid #d4af58;background:#5a491e;color:#ffe49a;border-radius:10px;padding:9px 14px}
.toast{position:fixed;z-index:300;top:70px;left:50%;transform:translateX(-50%);background:#1e2d20;border:1px solid #718466;border-radius:11px;padding:8px 13px;opacity:0;transition:.2s}.toast.on{opacity:1}
@media(max-width:700px){.brand{font-size:12px}.stat{font-size:11px;padding:7px}.bottom button{font-size:13px;padding:8px 10px}}

/* More natural farm visuals: drawn shapes instead of emoji icons */
.animal{position:absolute;z-index:24;font-size:0;transition:transform 2.4s ease-in-out;filter:drop-shadow(0 8px 5px rgba(25,35,20,.42))}
.sheep{width:105px;height:68px}.sheep .body{position:absolute;left:8px;top:13px;width:78px;height:47px;border-radius:48% 55% 45% 52%;background:radial-gradient(circle at 30% 30%,#fff 0 18%,#e9e5d9 19% 42%,#c9c4b7 43% 100%);border:3px solid #88847b}
.sheep .head{position:absolute;right:3px;top:24px;width:33px;height:32px;border-radius:45% 48% 48% 42%;background:linear-gradient(135deg,#5d625f,#2e3432);border:3px solid #252b29}
.sheep .head:after{content:"";position:absolute;right:8px;top:8px;width:5px;height:5px;border-radius:50%;background:#f7f4e8;box-shadow:0 0 0 1px #111}
.sheep .leg{position:absolute;bottom:0;width:9px;height:25px;border-radius:5px;background:#343a37;border:2px solid #242a27}.sheep .leg.a{left:25px}.sheep .leg.b{left:62px}

.cow{width:125px;height:78px}.cow .body{position:absolute;left:7px;top:16px;width:94px;height:52px;border-radius:48% 50% 45% 50%;background:#f1eee6;border:3px solid #716d64;background-image:radial-gradient(circle at 25% 35%,#3d3a37 0 12%,transparent 13%),radial-gradient(circle at 63% 65%,#4a4641 0 15%,transparent 16%),radial-gradient(circle at 70% 25%,#4a4641 0 9%,transparent 10%)}
.cow .head{position:absolute;right:0;top:28px;width:37px;height:35px;border-radius:44% 50% 48% 40%;background:#544f49;border:3px solid #383532}
.cow .head:after{content:"";position:absolute;right:7px;top:10px;width:5px;height:5px;border-radius:50%;background:#111;box-shadow:-15px 0 0 #111}
.cow .horn{position:absolute;top:18px;width:15px;height:9px;border-radius:50%;background:#e8d6a0;border:2px solid #8a744a}.cow .horn.a{right:20px;transform:rotate(-25deg)}.cow .horn.b{right:3px;transform:rotate(25deg)}
.cow .leg{position:absolute;bottom:0;width:10px;height:28px;border-radius:5px;background:#3d3a36;border:2px solid #2b2927}.cow .leg.a{left:28px}.cow .leg.b{left:76px}

.chicken{width:72px;height:62px}.chicken .body{position:absolute;left:6px;top:17px;width:48px;height:39px;border-radius:55% 45% 52% 48%;background:linear-gradient(145deg,#fffdf4,#d9d3c5);border:3px solid #858077}.chicken .head{position:absolute;left:40px;top:5px;width:25px;height:25px;border-radius:50%;background:#eee8dc;border:3px solid #827c71}.chicken .head:after{content:"";position:absolute;left:13px;top:7px;width:4px;height:4px;border-radius:50%;background:#111}
.chicken .beak{position:absolute;left:62px;top:15px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:13px solid #d28a35}
.chicken .leg{position:absolute;bottom:0;width:4px;height:17px;background:#bf7d31;border-radius:3px}.chicken .leg.a{left:21px}.chicken .leg.b{left:39px}

/* More natural farmer */
.farmer{position:absolute;left:1050px;top:755px;width:72px;height:122px;z-index:25;transition:transform 1.5s linear;filter:drop-shadow(0 7px 4px rgba(20,30,18,.4))}
.farmer .head{position:absolute;left:20px;top:7px;width:31px;height:33px;border-radius:46% 46% 50% 50%;background:linear-gradient(135deg,#d9a276,#a96f4d);border:3px solid #674638}
.farmer .head:before{content:"";position:absolute;left:7px;top:10px;width:5px;height:5px;border-radius:50%;background:#33251f;box-shadow:14px 0 0 #33251f}
.farmer .hat{position:absolute;left:4px;top:-3px;width:58px;height:19px;border-radius:50%;background:linear-gradient(#d8b565,#a87f3d);border:3px solid #725929}
.farmer .body{position:absolute;left:10px;top:39px;width:50px;height:55px;border-radius:12px 12px 9px 9px;background:linear-gradient(135deg,#557e51,#294d32);border:3px solid #263f2b}
.farmer .body:after{content:"";position:absolute;left:21px;top:0;width:7px;height:55px;background:#263f2b}
.farmer .leg{position:absolute;top:91px;width:15px;height:31px;border-radius:8px;background:#41382f;border:2px solid #2b2621}.farmer .l1{left:14px}.farmer .l2{right:14px}

/* Realistic field: larger continuous soil with visible planted rows */
.field{background:
  repeating-linear-gradient(0deg,#6f472c 0 18px,#875735 19px 25px,#6b432a 26px 34px);
}
.field .inner{background:repeating-linear-gradient(0deg,transparent 0 35px,rgba(194,139,82,.22) 36px 40px)}
.cropPatch{background:
  linear-gradient(180deg,rgba(102,143,62,.96),rgba(55,103,43,.98)),
  repeating-linear-gradient(90deg,#9ebd60 0 3px,transparent 4px 10px);
  border:4px solid #52753b;
}
.cropPatch:before{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,transparent 0 9px,#a9ca69 10px 13px,transparent 14px 20px);opacity:.8}
.cropPatch:after{display:none}

/* More stone-like well */
.well{background:radial-gradient(circle at 50% 47%,#4d9daf 0 27%,#316c7c 28% 40%,transparent 41%),repeating-conic-gradient(from 8deg,#8e928b 0 7deg,#6f756f 8deg 15deg);border:12px solid #777c76}
.well:before{background:linear-gradient(#5b605a,#353a36);box-shadow:5px 0 0 #454a46}
.well:after{background:#3f4540}

</style>
</head>
<body>
<div id="game">
<div id="world">
  <div class="waterway"></div><div class="path h"></div><div class="path v"></div>
  <div class="zoneTitle" style="left:70px;top:55px">🌿 مزرعة Kingdom Harvest</div>

  <div class="building house"><div class="roof"></div><div class="body"></div><div class="door"></div><div class="window w1"></div><div class="window w2"></div></div>
  <div class="building storage"><div class="roof"></div><div class="body"></div><div class="door"></div></div>
  <div class="building market"><div class="roof"></div><div class="body"></div><div class="awning"></div><div class="door"></div></div>
  <div class="building barn sheepBarn"><div class="roof"></div><div class="body"></div><div class="doubleDoor"></div></div>
  <div class="building barn cowBarn"><div class="roof"></div><div class="body"></div><div class="doubleDoor"></div></div>
  <div class="building coop"><div class="roof"></div><div class="body"></div><div class="door"></div></div>
  <div class="well"></div>

  <div class="animal sheep s1"><i class="body"></i><i class="head"></i><i class="leg a"></i><i class="leg b"></i></div>
  <div class="animal sheep s2"><i class="body"></i><i class="head"></i><i class="leg a"></i><i class="leg b"></i></div>
  <div class="animal cow c1"><i class="body"></i><i class="head"></i><i class="horn a"></i><i class="horn b"></i><i class="leg a"></i><i class="leg b"></i></div>
  <div class="animal cow c2"><i class="body"></i><i class="head"></i><i class="horn a"></i><i class="horn b"></i><i class="leg a"></i><i class="leg b"></i></div>
  <div class="animal chicken ch"><i class="body"></i><i class="head"></i><i class="beak"></i><i class="leg a"></i><i class="leg b"></i></div>

  <div class="field">
    <div class="label">🌾 الحقل الرئيسي</div><div class="inner"></div>
    <div class="furrow f1"></div><div class="furrow f2"></div><div class="furrow f3"></div>
    <div class="cropPatch"></div><div class="cropPatch patch2"></div><div class="cropPatch patch3"></div><div class="cropPatch patch4"></div><div class="cropPatch patch5"></div>
  </div>

  <div class="farmerTag">👨‍🌾 العامل</div>
  <div class="farmer"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div></div>

  <div class="farmText tHouse">البيت</div><div class="farmText tStorage">المخزن</div><div class="farmText tMarket">السوق</div>
  <div class="farmText tSheep">حظيرة الأغنام</div><div class="farmText tCow">حظيرة الأبقار</div><div class="farmText tChicken">حظيرة الدجاج</div><div class="farmText tWell">البئر</div>

  <div class="gate"><span>🚪 إلى المنطقة الصناعية</span></div>
</div>
</div>

<div class="hud">
  <div class="brand">KINGDOM HARVEST 🌾</div>
  <div class="stat">🪙 <b id="coins">12</b></div>
  <div class="stat">💧 <b id="water">20/20</b></div>
  <div class="stat">🌾 <b id="field">0/50</b></div>
  <div class="cam"><button id="minus">−</button><button id="plus">＋</button><button id="home">⌂</button></div>
</div>

<div class="bottom">
  <button class="gold" id="inventory">📦 المخزن</button>
  <button id="farmFocus">🌾 الحقل</button>
  <button id="animalFocus">🐑 الحظائر</button>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h2>📦 المخزن</h2><div class="resources" id="resources"></div><button class="close" id="close">إغلاق</button></div></div>

<script>
const $=id=>document.getElementById(id);
const state={coins:12,water:20,maxWater:20,field:0,cap:50,wheat:0,seeds:50,flour:0,straw:0,wool:0,leather:0,eggs:0,milk:0};
function ui(){$('coins').textContent=state.coins.toFixed(2).replace('.00','');$('water').textContent=state.water+'/'+state.maxWater;$('field').textContent=state.field+'/'+state.cap}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.remove('on'),1600)}
const game=$('game'),world=$('world');
let camX=0,camY=0,zoom=.62,dragging=false,startX=0,startY=0,baseX=0,baseY=0;

function clampCamera(){
  const vw=game.clientWidth,vh=game.clientHeight;
  const ww=2150*zoom,wh=1450*zoom;
  const minX=Math.min(0,vw-ww),minY=Math.min(0,vh-wh);
  camX=Math.max(minX,Math.min(0,camX));
  camY=Math.max(minY,Math.min(0,camY));
}
function drawCamera(){clampCamera();world.style.transform=`translate3d(${camX}px,${camY}px,0) scale(${zoom})`}

function centerOn(wx,wy,newZoom=zoom){
  zoom=Math.max(.55,Math.min(.85,newZoom));
  camX=game.clientWidth/2-wx*zoom;
  camY=game.clientHeight/2-wy*zoom;
  drawCamera();
}
$('home').onclick=()=>centerOn(720,760,.62);
$('farmFocus').onclick=()=>centerOn(760,1100,.68);
$('animalFocus').onclick=()=>centerOn(520,530,.82);
$('plus').onclick=()=>{zoom=Math.min(.85,zoom+.06);drawCamera()};
$('minus').onclick=()=>{zoom=Math.max(.55,zoom-.06);drawCamera()};

game.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  dragging=true;game.classList.add('drag');startX=e.clientX;startY=e.clientY;baseX=camX;baseY=camY;game.setPointerCapture(e.pointerId)
});
game.addEventListener('pointermove',e=>{if(!dragging)return;camX=baseX+(e.clientX-startX);camY=baseY+(e.clientY-startY);drawCamera()});
game.addEventListener('pointerup',()=>{dragging=false;game.classList.remove('drag')});
game.addEventListener('pointercancel',()=>{dragging=false;game.classList.remove('drag')});

function moveFarmer(){
  const targets=[[1040,755],[1160,600],[1030,830],[650,910],[1100,780]];
  let i=0;
  setInterval(()=>{
    const [tx,ty]=targets[i++%targets.length];
    const el=$('.farmer');
    el.style.transform=`translate(${tx-1050}px,${ty-755}px)`;
  },3200);
}
function moveAnimals(){
  const animals=[['.s1',35,0],['.s2',-28,8],['.c1',30,-5],['.c2',-35,5],['.ch',24,4]];
  setInterval(()=>animals.forEach(([sel,a,b])=>{$(sel.slice(1)).style.transform=`translate(${(Math.random()*2-1)*a}px,${(Math.random()*2-1)*b}px)`}),2600);
}
function inventory(){
  const data=[['🌾 قمح','wheat'],['🌱 بذور','seeds'],['🥣 طحين','flour'],['🌾 تبن','straw'],['🧶 صوف','wool'],['🧴 جلد','leather'],['🥚 بيض','eggs'],['🥛 حليب','milk']];
  $('resources').innerHTML=data.map(([n,k])=>`<div><b>${n}</b><br>${state[k]||0}</div>`).join('');
  $('modal').classList.add('show');
}
$('inventory').onclick=inventory;
$('close').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});

ui();
moveFarmer();
moveAnimals();
setTimeout(()=>centerOn(720,760,.68),50);
